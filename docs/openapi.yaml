components:
  schemas:
    EthereumAddress:
      type: string
      pattern: "^0x[a-fA-F0-9]{40}$"
      description: Ethereum address (40 hex characters)
      example: "0x742d35Cc6634C0532925a3b844Bc9e7595f0bEb"

    Address:
      type: object
      description: Address document
      properties:
        address:
          $ref: "#/components/schemas/EthereumAddress"
        isMember:
          type: boolean
        isAdmin:
          type: boolean
        isCreator:
          type: boolean
        visibility:
          type: string
          enum: [public, private]
        role:
          type: string
          enum: [admin, creator, member]
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        slug:
          type: string
        avatar:
          type: string

    PrivateAddressData:
      type: object
      description: Private address contact information
      properties:
        name:
          type: string
          nullable: true
        email:
          type: string
          format: email
        twitterHandle:
          type: string
          nullable: true
        discordHandle:
          type: string
          nullable: true
        discordUserID:
          type: string
          nullable: true
        dmChannel:
          type: string
          nullable: true

    ContactInfo:
      type: object
      description: Contact information for address
      properties:
        name:
          type: string
          nullable: true
        twitterHandle:
          type: string
          nullable: true
        email:
          type: string
          format: email

    Application:
      type: object
      description: Creator application document
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        city:
          type: string
        info:
          type: string
        workLink:
          type: string
        ethAddress:
          $ref: "#/components/schemas/EthereumAddress"
        tracks:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              id:
                type: string

    CreatorApplication:
      type: object
      required:
        - firstName
        - lastName
        - email
        - city
        - tracks
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        city:
          type: string
          minLength: 1
        info:
          type: string
        workLink:
          type: string
        ethAddress:
          $ref: "#/components/schemas/EthereumAddress"
        tracks:
          type: array
          items:
            type: object
            required:
              - name
              - id
            properties:
              name:
                type: string
                minLength: 1
              id:
                type: string
                minLength: 1

    Session:
      type: object
      description: Session document
      properties:
        id:
          type: string
        name:
          type: string
        creator:
          $ref: "#/components/schemas/EthereumAddress"
        tags:
          type: array
          items:
            type: string
        versions:
          type: array
          items:
            $ref: "#/components/schemas/Version"

    SessionDetails:
      type: object
      required:
        - creator
        - name
        - bounce
        - stems
        - bpm
      properties:
        creator:
          $ref: "#/components/schemas/EthereumAddress"
        name:
          type: string
          nullable: true
        bounce:
          type: string
        stems:
          type: array
          items:
            type: string
        notes:
          type: string
        tags:
          type: array
          items:
            type: string
        bpm:
          type: number

    Version:
      type: object
      description: Version document
      properties:
        id:
          type: string
        name:
          type: string
        creator:
          $ref: "#/components/schemas/EthereumAddress"
        bounce:
          type: string
        stems:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
        notes:
          type: string
        tags:
          type: array
          items:
            type: string
        bpm:
          type: number

    VersionDetails:
      type: object
      required:
        - creator
        - name
        - bounce
        - stems
        - bpm
      properties:
        creator:
          $ref: "#/components/schemas/EthereumAddress"
        name:
          type: string
          nullable: true
        bounce:
          type: string
        stems:
          type: array
          items:
            type: string
        notes:
          type: string
        tags:
          type: array
          items:
            type: string
        bpm:
          type: number

    Activity:
      type: object
      description: Activity log entry
      properties:
        id:
          type: string
        type:
          type: string
          enum: [PLAY, DOWNLOAD]
        initiator:
          $ref: "#/components/schemas/EthereumAddress"
        timestamp:
          type: string
          format: date-time
        sessionId:
          type: string
        versionId:
          type: string

    Settings:
      type: object
      description: Global settings document
      properties:
        membershipContracts:
          type: array
          items:
            $ref: "#/components/schemas/EthereumAddress"
        stemsCarousel:
          type: array
          items:
            type: string

    Tag:
      type: object
      description: Tag document
      properties:
        name:
          type: string
        category:
          type: string
          enum: [member, session]

    TagCategory:
      type: object
      description: Tag category document
      properties:
        name:
          type: string
        type:
          type: string
          enum: [member, session]

  responses:
    BadRequest:
      description: Bad request - Invalid parameters or request body
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Invalid request

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Resource not found

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: Internal server error
