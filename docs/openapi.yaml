openapi: 3.0.3
info:
  title: Phlote API
  description: API documentation for Phlote application
  version: 1.0.0
servers:
  - url: /api
    description: Default API server

tags:
  - name: Address
    description: Address management endpoints
  - name: Admins
    description: Admin management endpoints
  - name: Applications
    description: Application management endpoints
  - name: Audio
    description: Audio processing endpoints
  - name: Auth
    description: Authentication endpoints
  - name: Contracts
    description: Membership contract management endpoints
  - name: Creator Applications
    description: Creator application endpoints
  - name: Creators
    description: Creator management endpoints
  - name: Newsletter
    description: Newsletter subscription endpoints
  - name: Sessions
    description: Session and version management endpoints
  - name: Settings
    description: Global settings management endpoints
  - name: Subscribers
    description: Subscriber management endpoints
  - name: Tags
    description: Tag and category management endpoints

paths:
  /address:
    get:
      tags:
        - Address
      summary: Get addresses with optional filters
      description: Retrieve addresses with optional visibility and role filters
      parameters:
        - name: visibility
          in: query
          schema:
            type: string
            enum: [public, private]
          description: Filter by visibility
        - name: role
          in: query
          schema:
            type: string
            enum: [admin, creator, member]
          description: Filter by role
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  addresses:
                    type: array
                    items:
                      $ref: "#/components/schemas/Address"
                  totalCount:
                    type: number
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Address
      summary: Create a new address (onboarding)
      description: Create a new address during the onboarding process
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
              properties:
                address:
                  $ref: "#/components/schemas/EthereumAddress"
      responses:
        "200":
          description: Success (address created or already exists)
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    $ref: "#/components/schemas/Address"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - Address
      summary: Update address properties
      description: Update role, title, tags, or visibility of an address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
              properties:
                address:
                  $ref: "#/components/schemas/EthereumAddress"
                role:
                  type: string
                  enum: [admin, creator, member]
                title:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                visibility:
                  type: string
                  enum: [public, private]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Address updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /address/{address}:
    get:
      tags:
        - Address
      summary: Get a single address by address
      description: Retrieve a single address document by Ethereum address
      parameters:
        - name: address
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/EthereumAddress"
        - name: include
          in: query
          schema:
            type: string
            enum: [private]
          description: Include private data
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - Address
      summary: Update address slug and role
      description: Update the slug and role of an address
      parameters:
        - name: address
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/EthereumAddress"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - slug
                - role
              properties:
                slug:
                  type: string
                role:
                  type: string
                  enum: [admin, creator, member]
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /address/{address}/private:
    get:
      tags:
        - Address
      summary: Get private address data
      description: Retrieve private contact information for an address
      parameters:
        - name: address
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/EthereumAddress"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateAddressData"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags:
        - Address
      summary: Update private address contact information
      description: Update name, twitter handle, and email for an address
      parameters:
        - name: address
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/EthereumAddress"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInfo"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Contact updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /address/{address}/sync:
    post:
      tags:
        - Address
      summary: Sync address membership status
      description: Sync address membership status with blockchain contracts
      parameters:
        - name: address
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/EthereumAddress"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    $ref: "#/components/schemas/EthereumAddress"
                  isMember:
                    type: boolean
                  syncStatus:
                    type: string
                    enum: [updated, unchanged]
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /admins:
    get:
      tags:
        - Admins
      summary: Get admin addresses
      description: Retrieve all admin addresses, optionally filtered by visibility
      parameters:
        - name: visibility
          in: query
          schema:
            type: string
            enum: [public, private]
          description: Filter by visibility
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  admins:
                    type: array
                    items:
                      $ref: "#/components/schemas/Address"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Admins
      summary: Add a new admin address
      description: Create or update an address as an admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
              properties:
                address:
                  $ref: "#/components/schemas/EthereumAddress"
      responses:
        "200":
          description: Address updated as admin
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Address updated as admin
        "201":
          description: Admin created
          content:
            application/json:
              schema:
                type: object
                properties:
                  admin:
                    $ref: "#/components/schemas/Address"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Admins
      summary: Remove an admin address
      description: Delete an admin address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
              properties:
                address:
                  $ref: "#/components/schemas/EthereumAddress"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Admin address deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /applications:
    get:
      tags:
        - Applications
      summary: Get all applications
      description: Retrieve all applications
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /applications/{applicationId}:
    get:
      tags:
        - Applications
      summary: Get a single application by ID
      description: Retrieve a single application document
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /audio:
    post:
      tags:
        - Audio
      summary: Upload and process an audio file
      description: Upload an audio file and start processing
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - audio
              properties:
                audio:
                  type: string
                  format: binary
                  description: Audio file (wav, mp3, mpeg)
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  tmpName:
                    type: string
                  status:
                    type: string
                    enum: [pending, processing, ready, failed]
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    get:
      tags:
        - Audio
      summary: Get audio by hash
      description: Retrieve audio information by hash
      parameters:
        - name: hash
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  audio:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /audio/status/{temporaryAudioFile}:
    get:
      tags:
        - Audio
      summary: Get audio processing status
      description: Check the processing status of an uploaded audio file
      parameters:
        - name: temporaryAudioFile
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                    enum: [pending, processing, ready, failed]
        "500":
          $ref: "#/components/responses/InternalServerError"

  /audio/wavetrace/{audioId}:
    get:
      tags:
        - Audio
      summary: Get audio wave trace data
      description: Retrieve wave trace visualization data for an audio file
      parameters:
        - name: audioId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  audio:
                    type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /auth:
    post:
      tags:
        - Auth
      summary: Authenticate and create/retrieve address
      description: Authenticate a user and create or retrieve their address document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
              properties:
                address:
                  $ref: "#/components/schemas/EthereumAddress"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    $ref: "#/components/schemas/Address"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /contracts:
    post:
      tags:
        - Contracts
      summary: Add a membership contract
      description: Add a new membership contract address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - contractAddress
              properties:
                contractAddress:
                  $ref: "#/components/schemas/EthereumAddress"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Contract added
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /contracts/{contractAddress}:
    delete:
      tags:
        - Contracts
      summary: Remove a membership contract
      description: Remove a membership contract address
      parameters:
        - name: contractAddress
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/EthereumAddress"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Contract address removed
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /creator-applications:
    post:
      tags:
        - Creator Applications
      summary: Create a creator application
      description: Submit a new creator application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatorApplication"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  applicationId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /creators:
    get:
      tags:
        - Creators
      summary: Get creator addresses
      description: Retrieve all creator addresses, optionally filtered by visibility
      parameters:
        - name: visibility
          in: query
          schema:
            type: string
            enum: [public, private]
          description: Filter by visibility
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  creators:
                    type: array
                    items:
                      $ref: "#/components/schemas/Address"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Creators
      summary: Add a new creator address
      description: Create or update an address as a creator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
              properties:
                address:
                  $ref: "#/components/schemas/EthereumAddress"
      responses:
        "200":
          description: Address updated as creator
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Address updated as creator
        "201":
          description: Creator created
          content:
            application/json:
              schema:
                type: object
                properties:
                  creator:
                    $ref: "#/components/schemas/Address"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Creators
      summary: Remove a creator address
      description: Delete a creator address
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - address
              properties:
                address:
                  $ref: "#/components/schemas/EthereumAddress"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Creator address deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /newsletter:
    post:
      tags:
        - Newsletter
      summary: Subscribe to newsletter
      description: Add an email to the newsletter subscription list
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Received
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /sessions:
    get:
      tags:
        - Sessions
      summary: Get all sessions
      description: Retrieve all sessions
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Sessions
      summary: Create a new session
      description: Create a new session with initial version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionDetails"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Session created successfully
                  sessionId:
                    type: string
                  versionId:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /sessions/{sessionId}:
    get:
      tags:
        - Sessions
      summary: Get a single session by ID
      description: Retrieve a single session document
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - Sessions
      summary: Update session name
      description: Update the name of a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: string
              description: New session name
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Session updated successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /sessions/{sessionId}/activity:
    get:
      tags:
        - Sessions
      summary: Get session activity
      description: Retrieve activity log for a session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /sessions/{sessionId}/versions:
    get:
      tags:
        - Sessions
      summary: Get versions for a session
      description: Retrieve all versions for a specific session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - name: index
          in: query
          schema:
            type: integer
          description: Version index
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Version"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /sessions/versions:
    get:
      tags:
        - Sessions
      summary: Get all versions for a session
      description: Retrieve all versions for a session (alternative endpoint)
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Session ID
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Version"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Sessions
      summary: Create a new version for a session
      description: Create a new version for an existing session
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
          description: Session ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionDetails"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /sessions/versions/{versionId}:
    get:
      tags:
        - Sessions
      summary: Get a single version by ID
      description: Retrieve a single version document
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /sessions/versions/{versionId}/activity:
    get:
      tags:
        - Sessions
      summary: Get version activity
      description: Retrieve activity log for a version
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Sessions
      summary: Register session activity for a version
      description: Record an activity event (PLAY or DOWNLOAD) for a version
      parameters:
        - name: versionId
          in: path
          required: true
          schema:
            type: string
        - name: sessionId
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - initiator
              properties:
                type:
                  type: string
                  enum: [PLAY, DOWNLOAD]
                initiator:
                  $ref: "#/components/schemas/EthereumAddress"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
